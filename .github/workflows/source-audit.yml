name: Source audit and Android AR build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-audit:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.10'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -I studio.py --help
      - run: python -I -m unittest discover -s tests -v
      - run: python -I tools/verify_baseline.py
      - run: python -I tools/release.py audit --tracked
  android-ar-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: ./gradlew :app:assembleDebug :app:lintDebug :ar-toolkit:lintDebug --no-daemon --max-workers=2
        working-directory: apps/ar-photo-android
      - name: Check APK before public artifact upload
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          path = 'apps/ar-photo-android/app/build/outputs/apk/debug/app-debug.apk'
          with ZipFile(path) as apk:
              names = apk.namelist()
          approved = ('assets/environments/neutral/', 'assets/materials/', 'assets/textures/')
          unexpected = [name for name in names if name.startswith('assets/')
                        and not name.endswith('/') and not name.startswith(approved)]
          forbidden = [name for name in names if name.lower().endswith(
              ('.glb', '.gltf', '.mp4', '.bundle', '.assetbundle', '.fbx', '.vrm'))]
          if unexpected or forbidden:
              raise SystemExit(f'Unreviewed APK payload: assets={unexpected}, media={forbidden}')
          print('APK asset boundary accepted')
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: ar-photo-debug-apk
          path: apps/ar-photo-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 2
